name: Verify extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and test Rust optimizer
        run: |
          rustup target add wasm32-unknown-unknown
          python Installers/build_optimizer.py
          rustc --edition=2021 --test rust/optimizer_core.rs -o build/optimizer-core-tests
          ./build/optimizer-core-tests
          rustc --edition=2021 --test rust/browser_engine.rs -o build/browser-engine-tests
          ./build/browser-engine-tests
          rustc --edition=2021 --test rust/history_engine.rs -o build/history-engine-tests
          ./build/history-engine-tests
          rustc --edition=2021 --test rust/queue_engine.rs -o build/queue-engine-tests
          ./build/queue-engine-tests
      - name: Verify Rust release utility
        run: |
          cargo test --manifest-path Installers/native/Cargo.toml
          cargo run --release --manifest-path Installers/native/Cargo.toml -- package --repo-dir .
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run JavaScript tests, lint and typecheck
        run: npm run check
      - name: Run Python release tests
        run: python -m unittest discover -s Installers -p 'test_*.py'
