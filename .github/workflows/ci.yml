name: Verify extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run JavaScript tests, lint and typecheck
        run: npm run check
      - name: Run Python release tests
        run: python -m unittest discover -s Installers -p 'test_*.py'
