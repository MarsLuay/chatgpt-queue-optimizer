name: Verify extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile and test Rust optimizer
        run: |
          rustup target add wasm32-unknown-unknown
          cargo run --release --manifest-path Installers/native/Cargo.toml -- build --repo-dir .
          rustc --edition=2021 --test rust/optimizer_core.rs -o build/optimizer-core-tests
          ./build/optimizer-core-tests
          rustc --edition=2021 --test rust/browser_engine.rs -o build/browser-engine-tests
          ./build/browser-engine-tests
          rustc --edition=2021 --test rust/history_engine.rs -o build/history-engine-tests
          ./build/history-engine-tests
          rustc --edition=2021 --test rust/queue_engine.rs -o build/queue-engine-tests
          ./build/queue-engine-tests
      - name: Verify Rust release utility
        run: |
          cargo test --manifest-path Installers/native/Cargo.toml
          cargo run --release --manifest-path Installers/native/Cargo.toml -- check-secrets --repo-root .
          cargo run --release --manifest-path Installers/native/Cargo.toml -- package --repo-dir .
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run JavaScript tests, lint and typecheck
        run: npm run check

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native Windows UI Automation backend
        run: cargo check --manifest-path Installers/native/Cargo.toml --all-targets
      - name: Test native release utility
        run: cargo test --manifest-path Installers/native/Cargo.toml
