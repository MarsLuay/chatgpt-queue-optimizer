[package]
name = "cpo-release"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1.0"
rpassword = "7.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
sha2 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
