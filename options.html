<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Queue + Optimizer</title>
  <style>
    :root {
      color-scheme: light dark;

      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #edf0f3;
      --border: #d6dbe1;
      --text: #17202a;
      --muted: #5f6b7a;
      --accent: #0284c7;
      --green: #16a34a;
      --green-hover: #15803d;
      --green-text: #ffffff;
      --shadow: 0 18px 60px rgba(15, 23, 42, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111315;
        --panel: #181b1f;
        --panel-2: #20242a;
        --border: #30363d;
        --text: #f3f4f6;
        --muted: #a7adb7;
        --accent: #38bdf8;
        --green: #22c55e;
        --green-hover: #86efac;
        --green-text: #052e16;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      box-sizing: border-box;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--accent) 14%, transparent), transparent 34%),
        radial-gradient(circle at bottom right, color-mix(in srgb, var(--green) 12%, transparent), transparent 36%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .cat {
      font-family: "Courier New", Courier, monospace;
      white-space: pre;
      line-height: 1.1;
      font-size: 15px;
      margin: 0 0 22px;
      color: var(--accent);
    }

    p {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.55;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      font-weight: 750;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .button-link {
      display: inline-block;
      padding: 11px 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
    }

    .button-link:hover {
      filter: brightness(1.06);
      text-decoration: none;
    }

    .button-link.primary {
      background: var(--green);
      color: var(--green-text);
      border-color: var(--green);
    }

    .button-link.primary:hover {
      background: var(--green-hover);
      color: var(--green-text);
    }
  </style>
</head>
<body>
  <main class="card">
    <pre class="cat">
 /\_/\
( o.o )
 > ^ <
    </pre>

    <p>
      Here's my obligatory self-marketing:
      <a href="https://buymeacoffee.com/marwanluaye" target="_blank" rel="noopener noreferrer">Buy Me a Coffee</a>
      if you enjoyed the extension.
    </p>

    <p>
      Feel free to check out some of my other projects on
      <a href="https://github.com/MarsLuay" target="_blank" rel="noopener noreferrer">GitHub</a>.
    </p>

    <div class="links">
      <a class="button-link primary" href="https://buymeacoffee.com/marwanluaye" target="_blank" rel="noopener noreferrer">Buy Me a Coffee</a>
      <a class="button-link" href="https://github.com/MarsLuay" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </main>
</body>
</html>
